<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPS2 3D Online Multiplayer — Trac Studios</title>
  <link rel="icon" type="image/x-icon" href="FPS2-main/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #080c16;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    body.in-iframe header {
      display: none !important;
    }
    body.in-iframe #game-container {
      height: 100vh !important;
    }

    /* Top Navigation Bar */
    header {
      height: 56px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 245, 212, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .logo-badge {
      background: linear-gradient(135deg, #00f5d4, #00b4d8);
      color: #0f172a;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    .title {
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 245, 212, 0.12);
      border: 1px solid rgba(0, 245, 212, 0.4);
      color: #00f5d4;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #00f5d4;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f5d4;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: #334155;
      border-color: #00f5d4;
      color: #00f5d4;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f5d4, #00b4d8);
      color: #0f172a;
      border: none;
      font-weight: 700;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #00b4d8, #00f5d4);
      box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
    }

    /* Game Container */
    #game-container {
      flex: 1;
      position: relative;
      background: #000;
      width: 100%;
      height: calc(100vh - 56px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Floating Controls Bar at Bottom */
    .controls-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 6px 18px;
      font-size: 12px;
      color: #94a3b8;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .controls-hint kbd {
      background: #334155;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="brand">
      <div class="logo-badge">TRAC</div>
      <div class="title">FPS2 3D Online Shooter</div>
      <div class="live-badge">
        <span class="live-dot"></span> P2P 1V1 MULTIPLAYER & BOT
      </div>
    </a>

    <div class="actions">
      <button class="btn" onclick="shareRoom()">
        <span>🔗</span> Oda Linki
      </button>
      <button class="btn" onclick="reloadGame()">
        <span>🔄</span> Yenile
      </button>
      <button class="btn btn-primary" onclick="toggleFullScreen()">
        <span>⛶</span> Tam Ekran
      </button>
      <a href="index.html" class="btn">
        <span>🏠</span> Portala Dön
      </a>
    </div>
  </header>

  <div id="game-container">
    <iframe 
      id="fps-frame"
      src="FPS2-main/src.html" 
      allow="autoplay; fullscreen; pointer-lock; gamepad"
      allowfullscreen>
    </iframe>

    <div class="controls-hint">
      <span><kbd>W A S D</kbd> Hareket</span>
      <span><kbd>Fare</kbd> Nişan & Ateş</span>
      <span><kbd>Space</kbd> Zıpla</span>
      <span><kbd>R</kbd> Şarjör</span>
      <span><kbd>Q / Tekerlek</kbd> Silah Değiştir</span>
      <span><kbd>T / Enter</kbd> Chat</span>
    </div>
  </div>

  <script>
    if (window.self !== window.top) {
      document.body.classList.add('in-iframe');
    }

    // Forward query params if any
    const params = window.location.search;
    if (params) {
      document.getElementById('fps-frame').src = 'FPS2-main/src.html' + params;
    }

    function reloadGame() {
      const f = document.getElementById('fps-frame');
      f.src = f.src;
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert('Tam ekran yapılamadı: ' + err.message);
        });
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function shareRoom() {
      const code = prompt('Arkadaşınla oynamak için oda kodunu girin (Örn: FPS101):', 'FPS101');
      if (code) {
        const clean = code.trim().toUpperCase();
        const url = window.location.origin + window.location.pathname.replace('fps2.html', '') + 'fps2.html?lobby=' + clean + '&role=guest';
        navigator.clipboard.writeText(url).then(() => {
          alert('Davet linki kopyalandı! Arkadaşına at:\n' + url);
        }).catch(() => {
          prompt('Davet linki:', url);
        });
        document.getElementById('fps-frame').src = 'FPS2-main/src.html?lobby=' + clean + '&role=host';
      }
    }
  </script>
</body>
</html>
