<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suroi.io Online Battle Royale — Trac Studios</title>
  <link rel="icon" type="image/svg+xml" href="https://suroi.io/img/logos/suroi_favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    body.in-iframe header {
      display: none !important;
    }
    body.in-iframe #game-container {
      height: 100vh !important;
    }

    /* Top Navigation Bar */
    header {
      height: 56px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 245, 212, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .logo-badge {
      background: linear-gradient(135deg, #00f5d4, #00b4d8);
      color: #0f172a;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    .title {
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 245, 212, 0.12);
      border: 1px solid rgba(0, 245, 212, 0.4);
      color: #00f5d4;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #00f5d4;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f5d4;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: #334155;
      border-color: #00f5d4;
      color: #00f5d4;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f5d4, #00b4d8);
      color: #0f172a;
      border: none;
      font-weight: 700;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #00b4d8, #00f5d4);
      color: #0f172a;
      box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
    }

    /* Game Container */
    #game-container {
      flex: 1;
      position: relative;
      background: #000;
      width: 100%;
      height: calc(100vh - 56px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Floating Controls Bar at Bottom */
    .controls-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 6px 18px;
      font-size: 12px;
      color: #94a3b8;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .controls-hint kbd {
      background: #334155;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="brand">
      <div class="logo-badge">TRAC</div>
      <div class="title">Suroi.io Online Battle Royale</div>
      <div class="live-badge">
        <span class="live-dot"></span> CANLI ÇOK OYUNCULU
      </div>
    </a>

    <div class="actions">
      <button class="btn" onclick="openPartyModal()">
        <span>👥</span> Takım Kodu
      </button>
      <button class="btn" onclick="reloadFrame()">
        <span>🔄</span> Yenile
      </button>
      <button class="btn btn-primary" onclick="toggleFullScreen()">
        <span>⛶</span> Tam Ekran
      </button>
      <a href="index.html" class="btn">
        <span>🏠</span> Portala Dön
      </a>
    </div>
  </header>

  <div id="game-container">
    <iframe 
      id="suroi-frame"
      src="https://suroi.io" 
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock"
      allow="autoplay; fullscreen; clipboard-read; clipboard-write; gamepad"
      allowfullscreen>
    </iframe>

    <div class="controls-hint">
      <span><kbd>W A S D</kbd> Hareket</span>
      <span><kbd>Fare</kbd> Nişan & Ateş</span>
      <span><kbd>F</kbd> Eşya Topla / Kapı Aç</span>
      <span><kbd>R</kbd> Şarjör</span>
      <span><kbd>1-4</kbd> Silah Değiştir</span>
      <span><kbd>M</kbd> Harita</span>
    </div>
  </div>

  <script>
    if (window.self !== window.top) {
      document.body.classList.add('in-iframe');
    }

    function reloadFrame() {
      const frame = document.getElementById('suroi-frame');
      frame.src = frame.src;
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert('Tam ekran yapılamadı: ' + err.message);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function openPartyModal() {
      const teamCode = prompt('Arkadaşınla aynı oyuna girmek için Takım Linki veya Kodu gir:\n(Örnek: abc123 veya https://suroi.io/?team=abc123)');
      if (teamCode) {
        let targetUrl = teamCode.trim();
        if (!targetUrl.startsWith('http')) {
          targetUrl = 'https://suroi.io/?team=' + targetUrl;
        }
        document.getElementById('suroi-frame').src = targetUrl;
      }
    }
  </script>
</body>
</html>
